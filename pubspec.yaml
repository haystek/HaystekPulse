name: haystek_pulse
description: "Haystek Pulse"
publish_to: 'none'

version: 1.0.0+14

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  googleapis_auth: ^2.3.4
  google_fonts: ^8.2.1
  flutter_native_splash: ^2.4.0
  flutter_local_notifications: ^19.4.2
  pointycastle: ^4.0.0
  # Keeps the history key on the phone while signed in (Android Keystore /
  # iPhone Keychain). Deleted on sign out.
  flutter_secure_storage: ^9.2.4
  android_id: ^0.5.2
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1
  connectivity_plus: ^7.3.1
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - path: assets/fcm_sender.json
      flavors:
        - prod
    - path: assets/fcm_sender_dev.json
      flavors:
        - dev
    - assets/haystek_pulse_logo.png
    - assets/haystek_pulse_logo_big.png
    - assets/haystek_pulse_logo_on_blue.png

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

# Phone splash: same dark blue + logo card as the in-app loader.
# After a change: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0B1B4D"
  image: assets/splash/splash.png
  android_12:
    color: "#0B1B4D"
    image: assets/splash/splash_android12.png
  android: true
  ios: true
  web: false
